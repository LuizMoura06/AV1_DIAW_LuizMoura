<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos - Eleições 2026 - MG</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="cabecalho">
    <h1>Candidatos - Eleições 2026 - MG</h1>
</header>

<main class="conteudo">
    <form method="get" th:action="@{/}" class="filtros" aria-label="Filtrar candidatos">
        <div class="campo">
            <label for="texto">Buscar por nome / número</label>
            <input id="texto" type="search" name="texto" placeholder="Ex: Ana, 1240..."
                   th:value="${textoSelecionado}">
        </div>

        <div class="campo campo-cargo">
            <label for="cargo">Cargo</label>
            <select id="cargo" name="cargo">
                <option value="" th:selected="${cargoSelecionado == ''}">Todos</option>
                <option th:each="cargo : ${cargos}" th:value="${cargo}" th:text="${cargo}"
                        th:selected="${cargo == cargoSelecionado}"></option>
            </select>
        </div>

        <div class="campo">
            <label for="partido">Partido</label>
            <select id="partido" name="partido">
                <option value="" th:selected="${partidoSelecionado == ''}">Todos</option>
                <option th:each="partido : ${partidos}" th:value="${partido}" th:text="${partido}"
                        th:selected="${partido == partidoSelecionado}"></option>
            </select>
        </div>

        <div class="acoes">
            <button type="submit">Filtrar</button>
            <a th:href="@{/}" class="limpar">Limpar</a>
        </div>
    </form>

    <p class="contagem" role="status" th:text="|${total} candidato(s) encontrado(s).|">
        0 candidato(s) encontrado(s).
    </p>

    <p class="sem-resultados" th:if="${total == 0}">
        Nenhum candidato encontrado. Tente alterar ou limpar os filtros.
    </p>

    <section class="grade-candidatos" aria-label="Candidatos encontrados" th:if="${total > 0}">
        <article class="card" th:each="cand : ${candidatos}"
                 th:with="situacao=${#strings.trim(cand.situacaoCandidatura)},
                          ocupacao=${#strings.trim(cand.ocupacao)},
                          escolaridade=${#strings.trim(cand.grauInstrucao)},
                          municipio=${#strings.trim(cand.municipio)}">
            <img th:src="@{'/images/candidatos/' + ${cand.nomeArquivoFoto}}"
                 th:alt="${cand.nomeUrna}" class="foto-candidato" loading="lazy"
                 width="161" height="225"
                 th:data-fallback="@{/images/sem-foto.svg}"
                 onerror="this.onerror=null;this.src=this.dataset.fallback">
            <div class="dados-candidato">
                <h2 th:text="${cand.nomeUrna}">Nome de urna</h2>
                <p class="destaque" th:text="|Número: ${cand.nrCandidato}|">Número</p>
                <p class="destaque" th:text="${cand.cargo}">Cargo</p>
                <p th:text="|${cand.siglaPartido} - ${cand.nomePartido}|">Partido</p>
                <p th:if="${!#strings.isEmpty(municipio) and municipio != '#NULO' and municipio != '#NE' and municipio != '-4' and municipio != 'NÃO DIVULGÁVEL'}"
                   th:text="${municipio}">Município</p>
                <p th:if="${!#strings.isEmpty(situacao) and situacao != '#NULO' and situacao != '#NE' and situacao != '-4' and situacao != 'NÃO DIVULGÁVEL'}"
                   th:text="${situacao}">Situação da candidatura</p>
                <p th:if="${cand.idade >= 0}" th:text="|${cand.idade} anos|">Idade</p>
                <p th:if="${!#strings.isEmpty(ocupacao) and ocupacao != '#NULO' and ocupacao != '#NE' and ocupacao != '-4' and ocupacao != 'NÃO DIVULGÁVEL'}"
                   th:text="${ocupacao}">Ocupação</p>
                <p th:if="${!#strings.isEmpty(escolaridade) and escolaridade != '#NULO' and escolaridade != '#NE' and escolaridade != '-4' and escolaridade != 'NÃO DIVULGÁVEL'}"
                   th:text="${escolaridade}">Escolaridade</p>
                <p class="nome-civil" th:text="${cand.nomeCandidato}">Nome civil</p>
            </div>
        </article>
    </section>
</main>
</body>
</html>
